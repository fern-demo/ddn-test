
instances:
  - url: ddn-test.docs.buildwithfern.com
ai-search:
  location:
    - docs
title: Fern Docs Starter
layout:
  searchbar-placement: header
  content-width: 54rem
  sidebar-width: 20rem
css: styles.css
navigation:
      - section: Get started
        contents:
          - page: Welcome
            path: docs/pages/welcome.mdx
            icon: fa-duotone fa-house
          - page: Edit your docs
            path: docs/pages/editing-your-docs.mdx
            icon: fa-duotone fa-pen-to-square
          - page: Write content
            path: docs/pages/writing-content.mdx
            icon: fa-duotone fa-file-lines
          - page: Set up navigation
            path: docs/pages/navigation.mdx
            icon: fa-duotone fa-sitemap
          - page: Customize your docs
            path: docs/pages/customization.mdx
            icon: fa-duotone fa-palette
          - page: API reference
            path: docs/pages/api-reference-overview.mdx
            icon: fa-duotone fa-code
          - page: Support
            path: docs/pages/support.mdx
            icon: fa-duotone fa-headset
          - section: Test Page
            path: docs/pages/test-page/test-page.mdx
            collapsed: true
            contents:
              - page: Test Section
                path: docs/pages/test-page/test-section.mdx
                icon: fa-duotone fa-vial
              - page: Test Table
                path: docs/pages/test-page/test-table.mdx
                icon: fa-duotone fa-table-list
              - page: Manage CATs
                path: docs/pages/test-page/manage-cats.mdx
                icon: fa-duotone fa-cat
              - page: Internal Only Content
                path: docs/pages/test-page/internal-only-content.mdx
                icon: fa-duotone fa-lock
          - section: Demo Section
            contents:
              - page: Demo Page
                path: ./docs/pages/docs/get-started/demo-section/demo-page.mdx
      - section: Changelog
        contents:
          - changelog: docs/changelog
      - section: Legal
        contents:
          - page: Copyright Information
            path: docs/pages/copyright-information.mdx
            hidden: true
navbar-links:
  - type: filled
    text: Contact DDN Support
    icon: fa-duotone fa-headset
    href: https://internal-docs.ddn.io/infinia/release-notes/contacting-ddn-support
colors:
  accent-primary: "#D71612"
  background:
    dark: "#1A1B1D"
    light: "#FFFFFF"
logo:
  dark: docs/assets/logo.png
  light: docs/assets/logo.png
  height: 50
  href: /
favicon: docs/assets/favicon.png
footer: ./components/CustomFooter.tsx
experimental:
  mdx-components:
    - ./components

